<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ORBIT</title>
  <style>
    /* ============================================================
       ORBIT · Base UI（iOS-inspired Neutral Theme）
       ------------------------------------------------------------
       本层是「基础视觉层」：只负责布局、结构、组件、交互状态、
       中性色变量与基础排版。基础层不加入玻璃/模糊/强渐变。
       未来制作 Skin（Liquid Glass / Frosted Acrylic / Dark
       Instrument / Editorial …）时，在 :root 覆盖下面的
       Design Tokens 即可换肤，不要改动组件结构与 HTML。
       ============================================================ */

    /* ---- Design Tokens：颜色 / 圆角 / 阴影 / 间距 ---- */
    :root {
      /* 背景与表面（浅色、安静、无噪音） */
      --color-bg:            #F5F5F7;   /* 页面背景：冷调米白 */
      --color-surface:       #FFFFFF;   /* 卡片表面 */
      --color-surface-2:     #F2F2F4;   /* 次级表面（内嵌/输入区） */
      --color-surface-3:     #ECECEF;   /* 三级表面（分段控件底） */

      /* 文字层级 */
      --color-text-1:        #1D1D1F;   /* 主文字 */
      --color-text-2:        #6E6E73;   /* 次级文字 */
      --color-text-3:        #AEAEB2;   /* 说明/弱化文字 */

      /* 强调色：低饱和灰（不使用鲜艳蓝） */
      --color-accent:        #737B83;   /* 中性银灰 */
      --color-accent-strong: #3A3A3C;   /* 炭黑深灰：主按钮/选中态 */
      --color-accent-soft:   rgba(60, 60, 67, 0.08);

      /* 边框 / 分隔 */
      --color-border:        rgba(60, 60, 67, 0.12);
      --color-hairline:      rgba(60, 60, 67, 0.10);

      /* 状态色：灰阶深浅 + 字重区分，克制、不游戏化 */
      --st-vd: #8A8A8E;   /* ↓↓ 被限制 */
      --st-d:  #9A9AA0;   /* ↓ 下降 */
      --st-s:  #B3B3B8;   /* → 平稳 */
      --st-u:  #5E5E64;   /* ↑ 流动 */
      --st-vu: #38383A;   /* ↑↑ 高度创造 */
      --st-very-down: var(--st-vd);   /* 兼容别名：进度条 fill 等使用 */
      --st-down: var(--st-d);
      --st-stable: var(--st-s);
      --st-up: var(--st-u);
      --st-very-up: var(--st-vu);
      --star:  #E0C883;   /* ★ 重点观察：白金色（保持存在感） */

      /* 危险（仅语义按钮，低饱和） */
      --color-danger:        #B4554D;
      --color-danger-soft:   rgba(180, 85, 77, 0.08);

      /* 圆角层级：小=控件，中=输入，大=卡片，特大=容器 */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;

      /* 阴影：柔和、克制 */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 1px 3px rgba(0, 0, 0, 0.05), 0 6px 16px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 -2px 16px rgba(0, 0, 0, 0.06);

      /* 间距 */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 28px;

      /* 字体与动效 */
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --dur: 0.18s;

      /* ---- 兼容别名：旧自定义 CSS / 内联样式仍可使用 ---- */
      --primary: var(--color-accent-strong);
      --primary-soft: var(--color-accent-soft);
      --text-1: var(--color-text-1);
      --text-2: var(--color-text-2);
      --text-3: var(--color-text-3);
      --bg: var(--color-bg);
      --glass: var(--color-surface);
      --glass-strong: var(--color-surface);
      --hairline: var(--color-hairline);
      --radius: var(--radius-lg);
      --shadow: var(--shadow-md);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text-1);
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .app {
      width: 100%; height: 100dvh;
      display: flex; flex-direction: column;
      padding: 0 var(--sp-4) var(--ai-phone-app-safe-bottom, 20px);
      background: var(--color-bg);
    }

    /* 顶栏：标题 + 设置 */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--ai-phone-app-safe-top, 40px) 2px 0;
      height: calc(var(--ai-phone-app-safe-top, 40px) + 48px);
      flex-shrink: 0;
    }
    .topbar h1 { font-size: 23px; font-weight: 700; letter-spacing: 0.3px; margin: 0; }
    .icon-btn {
      width: 34px; height: 34px; border: none; border-radius: 50%;
      background: var(--color-surface-2);
      color: var(--color-text-2); font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--dur) var(--ease);
    }
    .icon-btn:active { background: var(--color-surface-3); }

    /* 标签导航：iOS 分段控件风格，选中=灰底白块 */
    .tabnav {
      display: flex; gap: 2px;
      padding: 3px;
      margin: 4px 2px 10px;
      background: var(--color-surface-3);
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }
    .tabnav button {
      flex: 1; border: none; background: transparent; padding: 8px 0;
      border-radius: 9px; cursor: pointer;
      font-size: 14px; font-weight: 500; color: var(--color-text-2);
      font-family: inherit;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .tabnav button.active {
      background: var(--color-surface);
      color: var(--color-accent-strong);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    /* 页面容器 */
    .page { display: none; flex: 1; min-height: 0; }
    .page.active { display: flex; flex-direction: column; }
    .page-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: var(--sp-3) 0 var(--sp-6); }

    /* 卡片表面（基础层：近纯色 + 细边 + 柔影，无模糊/透明） */
    .glass {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    /* 月历标题栏：左翻/月份居中/右翻 */
    .cal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-3);
      margin-bottom: var(--sp-3);
    }
    .cal-head .month {
      font-size: 17px; font-weight: 600;
      flex: 1; text-align: center;
      white-space: nowrap;
    }
    .cal-nav-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: none; background: var(--color-accent-soft); color: var(--color-accent-strong);
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cal-nav-btn:active { opacity: 0.6; }

    /* 星期表头 */
    .cal-week {
      display: grid; grid-template-columns: repeat(7, 1fr);
      padding: 0 var(--sp-2) var(--sp-2);
      gap: var(--sp-1);
    }
    .cal-week span {
      text-align: center; font-size: 11px; font-weight: 500; color: var(--text-3);
      letter-spacing: 0.5px;
    }

    /* 月历网格：7列，完整显示，不裁切 */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      padding: 0 var(--sp-1);
    }
    .cal-cell {
      min-width: 0;
      aspect-ratio: 1 / 1.1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      cursor: pointer; padding: 4px 2px;
      overflow: hidden;
      transition: transform 0.1s, background 0.15s;
      gap: 1px;
    }
    .cal-cell:active { transform: scale(0.96); background: var(--color-surface-2); }
    .cal-cell .day-num {
      font-size: 13px; font-weight: 500; color: var(--text-2);
      line-height: 1.2; margin-top: auto;
    }
    .cal-cell .day-num.today { color: var(--color-accent-strong); font-weight: 700; }
    .cal-cell .day-num.dim { color: var(--text-3); }
    .cal-cell.is-today {
      border: 2px solid var(--color-accent-strong);
      background: var(--color-surface);
    }
    .cal-cell.is-selected {
      border: 1.5px solid var(--color-accent-strong);
      background: var(--color-surface-2);
    }
    .cal-cell .day-pct {
      font-size: 8px; font-weight: 600; line-height: 1;
      text-align: center; min-height: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-cell .day-pct.pct-low { color: #B0B0B4; }
    .cal-cell .day-pct.pct-high { color: #4A4A4E; }
    .cal-cell .day-star {
      font-size: 8px; color: var(--star); line-height: 1; min-height: 9px;
      display: flex; align-items: center; justify-content: center;
    }
    .cal-cell .day-trail {
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      line-height: 1.2; text-align: center;
      min-height: 13px; overflow: hidden; white-space: nowrap;
      display: flex; align-items: center; justify-content: center; gap: 1px;
    }
    .cal-cell .day-tags {
      font-size: 8px; color: var(--text-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      width: 100%; text-align: center;
      min-height: 0; margin-bottom: auto;
    }

    /* 状态轨迹配色：灰阶深浅 + 字重区分，克制不鲜艳 */
    .st-very-down { color: var(--st-vd); font-weight: 500; }
    .st-down { color: var(--st-d); font-weight: 500; }
    .st-stable { color: var(--st-s); font-weight: 400; }
    .st-up { color: var(--st-u); font-weight: 600; }
    .st-very-up { color: var(--st-vu); font-weight: 700; }

    /* 按钮 */
    .btn {
      border: none; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 15px; font-weight: 500;
      padding: 11px 18px; min-height: 42px;
      transition: background var(--dur) var(--ease), opacity var(--dur) var(--ease);
      font-family: inherit;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: var(--color-accent-strong); color: #fff; }
    .btn-soft { background: var(--color-accent-soft); color: var(--color-accent-strong); }
    .btn-ghost { background: var(--color-surface); color: var(--color-text-2); border: 1px solid var(--color-border); }
    .btn-danger { background: var(--color-danger-soft); color: var(--color-danger); }
    .btn-block { width: 100%; }
    .btn-sm { padding: 7px 14px; min-height: 34px; font-size: 13px; border-radius: 7px; }

    /* 月历底部：选中日观测预览 */
    .cal-foot {
      margin-top: var(--sp-4);
      padding: var(--sp-4);
    }
    .cal-foot-title {
      font-size: 15px; font-weight: 600; color: var(--color-text-1);
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: var(--sp-2);
    }
    .cal-foot-title .sub { font-size: 12px; color: var(--color-text-3); font-weight: 400; }
    .cal-foot-empty { font-size: 13px; color: var(--color-text-3); padding: 8px 0; line-height: 1.6; }
    .cal-foot-rec {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--color-hairline);
    }
    .cal-foot-rec:last-child { border-bottom: none; }
    .cal-foot-rec .sym { font-size: 15px; font-weight: 700; width: 34px; text-align: center; flex-shrink: 0; }
    .cal-foot-rec .tags { flex: 1; font-size: 12.5px; color: var(--color-text-2); display: flex; flex-wrap: wrap; gap: 4px; }
    .cal-foot-rec .tags .tg { background: var(--color-accent-soft); padding: 2px 8px; border-radius: 999px; }
    .cal-foot-note {
      font-size: 11.5px; color: var(--color-text-3);
      max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: var(--color-surface-2); padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
    }
    .cal-foot-editpct {
      width: 30px; height: 30px; border-radius: 50%;
      border: none; background: var(--color-accent-soft); color: var(--color-text-2);
      font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .cal-foot-editpct:active { background: var(--color-surface-3); }
    .cal-foot-creation {
      font-size: 12px; color: var(--text-3); margin-top: 8px; padding: 4px 0;
      display: flex; align-items: center; gap: 6px;
    }
    .cal-foot-creation .jump {
      background: var(--color-accent-soft); padding: 2px 8px; border-radius: 999px;
      color: var(--color-accent-strong); cursor: pointer; font-size: 12px;
    }

    /* 当天页头部 */
    .day-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sp-4) var(--sp-3);
      gap: 8px;
    }
    .day-head .date { font-size: 20px; font-weight: 700; letter-spacing: 0.2px; }
    .day-head .sub { font-size: 12px; color: var(--color-text-3); margin-top: 3px; }
    .day-nav-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: none; background: var(--color-accent-soft); color: var(--color-accent-strong);
      font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      opacity: 0.75;
    }
    .day-nav-btn:active { opacity: 1; }

    /* 记录卡片 */
    .record {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--sp-4);
      margin: 0 var(--sp-2) var(--sp-3);
    }
    .record.starred { box-shadow: 0 0 0 1px rgba(168, 136, 79, 0.15), var(--shadow-md); }
    .record-top { display: flex; align-items: center; justify-content: space-between; }
    .record-status { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .record-star { color: var(--star); font-size: 15px; }
    .record-meta { display: flex; align-items: center; gap: 10px; }
    .record-time { font-size: 12px; color: var(--color-text-3); }
    .record-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .record-tag {
      font-size: 12px; color: var(--color-text-2); background: var(--color-accent-soft);
      padding: 3px 9px; border-radius: 999px;
    }
    .record-note {
      margin-top: 10px; padding: 10px 12px; background: var(--color-surface-2);
      border-radius: var(--radius-sm); font-size: 13.5px; line-height: 1.55; color: var(--color-text-1);
      white-space: pre-wrap; word-break: break-word;
    }
    .empty {
      text-align: center; color: var(--color-text-3); font-size: 14px;
      padding: 48px 20px; line-height: 1.7;
    }
    .empty .icon { font-size: 34px; margin-bottom: 10px; opacity: 0.5; }

    /* ============ Bottom Sheet 弹窗 ============ */
    .sheet-mask {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.28);
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet-mask.open { display: flex; }
    .sheet {
      width: 100%; max-height: 88dvh; overflow-y: auto;
      background: var(--color-surface);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      border-top: 1px solid var(--color-border);
      box-shadow: var(--shadow-lg);
      padding: 10px var(--sp-5) calc(var(--ai-phone-app-safe-bottom, 20px) + 16px);
      animation: sheetUp 0.28s var(--ease);
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-grabber {
      width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.18);
      margin: 4px auto 16px;
    }
    .sheet-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: var(--sp-4); }

    /* 状态选择器：低饱和轻提示 */
    .status-picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .status-picker button {
      border: none; background: var(--color-accent-soft); border-radius: var(--radius-md);
      padding: 12px 2px; cursor: pointer; font-family: inherit;
      font-size: 15px; font-weight: 600; color: var(--color-text-2);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: all 0.15s; min-height: 54px;
    }
    .status-picker button .sym { font-size: 17px; line-height: 1.1; }
    .status-picker button .lbl { font-size: 9.5px; font-weight: 500; color: var(--text-3); }
    .status-picker button.sel { background: var(--color-accent-soft); }
    .status-picker button.sel .sym { color: var(--color-accent-strong); }
    .status-picker button.sel .lbl { color: var(--color-accent-strong); }

    .field { margin-bottom: var(--sp-4); }
    .field-label { font-size: 13px; font-weight: 500; color: var(--color-text-2); margin-bottom: 8px; }
    .field input[type="text"], .field textarea, .field input[type="time"] {
      width: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-md);
      background: var(--color-surface); padding: 12px 14px;
      font-size: 15px; font-family: inherit; color: var(--color-text-1);
      outline: none;
    }
    .field textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
    .field input:focus, .field textarea:focus { border-color: var(--color-accent-strong); background: var(--color-surface); }

    /* 标签选择 */
    .tag-picker { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-pick {
      border: 1px solid var(--color-border); background: var(--color-surface);
      border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--color-text-2);
      cursor: pointer; font-family: inherit;
      transition: all 0.12s;
    }
    .tag-pick.sel { background: var(--color-accent-soft); border-color: transparent; color: var(--color-accent-strong); font-weight: 500; }
    .tag-input-row { display: flex; gap: 8px; margin-top: 10px; }

    /* 开关（iOS 风格） */
    .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
    .switch-row .lbl { font-size: 15px; }
    .switch {
      width: 51px; height: 31px; border-radius: 16px; background: #E9E9EB;
      position: relative; cursor: pointer; transition: background 0.2s; border: none;
    }
    .switch::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 27px; height: 27px; border-radius: 50%; background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: left 0.2s;
    }
    .switch.on { background: var(--color-accent-strong); }
    .switch.on::after { left: 22px; }

    .settings-group {
      background: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid var(--color-border);
      margin-bottom: var(--sp-4); padding: 4px 16px;
    }
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 0; border-bottom: 1px solid var(--color-border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row .lbl { font-size: 15px; }
    .settings-row .val { color: var(--color-text-2); font-size: 15px; }

    /* 统计 */
    .stat-section { margin-bottom: var(--sp-6); padding: 0 var(--sp-2); }
    .stat-title { font-size: 13px; font-weight: 600; color: var(--color-text-3); letter-spacing: 0.3px; margin: 0 0 10px 4px; }
    .stat-card { padding: var(--sp-4) var(--sp-4); }
    .stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stat-total { font-size: 15px; font-weight: 600; }
    .stat-total b { font-size: 26px; font-weight: 700; margin-right: 4px; }
    .stat-sub { font-size: 12px; color: var(--color-text-3); }

    /* 分段控件（全部/本月/本周） */
    .seg {
      display: flex; background: var(--color-surface-3); border-radius: 9px; padding: 2px;
      gap: 2px; flex: 1; min-width: 168px; max-width: 196px; margin-left: 12px;
    }
    .seg button {
      flex: 1; border: none; background: transparent; padding: 4px 0; border-radius: 7px;
      font-size: 12px; color: var(--color-text-2); cursor: pointer; font-family: inherit;
    }
    .seg button.sel { background: var(--color-surface); color: var(--color-text-1); font-weight: 600; box-shadow: var(--shadow-sm); }

    .bar-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
    .bar-lbl { width: 40px; font-size: 13px; font-weight: 600; flex-shrink: 0; text-align: center; }
    .bar-count { width: 42px; font-size: 12px; color: var(--text-3); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .bar-track { flex: 1; height: 8px; border-radius: 4px; background: var(--color-surface-3); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; background: var(--color-accent-strong); transition: width 0.3s; }
    .bar-pct { width: 40px; text-align: right; font-size: 12px; color: var(--text-2); flex-shrink: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

    .tag-stat-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 6px;
      border-bottom: 1px solid var(--color-border);
    }
    .tag-stat-row:last-child { border-bottom: none; }
    .tag-stat-name { font-size: 14px; font-weight: 500; }
    .tag-stat-count { font-size: 14px; color: var(--color-text-3); font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 16px; }

    /* 趋势 */
    .trend-line { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 4px 2px; }
    .trend-item { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--color-text-2); }
    .trend-item .d { color: var(--color-text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
    .trend-item .s { font-weight: 700; font-size: 14px; }

    .hl-card { display: flex; align-items: center; gap: 12px; padding: 13px 14px; }
    .hl-card + .hl-card { margin-top: 8px; }
    .hl-card .hl-star { color: var(--star); font-size: 18px; flex-shrink: 0; }
    .hl-card .hl-main { flex: 1; min-width: 0; }
    .hl-card .hl-date { font-size: 13px; font-weight: 600; }
    .hl-card .hl-sub { font-size: 12px; color: var(--color-text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .link-btn {
      background: none; border: none; color: var(--color-accent-strong); font-size: 14px;
      padding: 10px 4px; cursor: pointer; font-family: inherit;
    }

    #custom-styles { display: none; }
    /* 有背景图时让 .app 背景透明 */
    body.has-bg .app { background: transparent; }

    /* 隐藏横向溢出 */
    .page-scroll { overflow-x: hidden; }
  </style>
</head>
<body>
  <div class="app">
    <!-- 顶栏 -->
    <div class="topbar">
      <h1>ORBIT</h1>
      <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙︎</button>
    </div>

    <!-- 标签导航 -->
    <div class="tabnav">
      <button class="active" data-tab="calendar">TRACE</button>
      <button data-tab="today">MOMENT</button>
      <button data-tab="stats">ARC</button>
    </div>

    <!-- 月历页 -->
    <div class="page active" id="page-calendar">
      <div class="page-scroll">
        <div class="cal-head glass">
          <button class="cal-nav-btn" id="prevMonthBtn" aria-label="上个月">‹</button>
          <span class="month" id="monthDisplay"></span>
          <button class="cal-nav-btn" id="nextMonthBtn" aria-label="下个月">›</button>
        </div>
        <div class="cal-week">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="cal-grid" id="calendarGrid"></div>

        <!-- 月历底部：选中日观测预览 -->
        <div class="cal-foot glass" id="calFoot" style="display:none;"></div>
      </div>
    </div>

    <!-- 当天页 -->
    <div class="page" id="page-today">
      <div class="page-scroll">
        <div class="day-head">
          <button class="day-nav-btn" id="prevDayBtn" aria-label="上一天">‹</button>
          <div style="flex:1; text-align:center; min-width:0;">
            <div class="date" id="todayDate"></div>
            <div class="sub" id="todayCount"></div>
          </div>
          <button class="day-nav-btn" id="nextDayBtn" aria-label="下一天">›</button>
          <button class="btn btn-soft btn-sm" id="addRecordBtn" style="margin-left:6px; padding:7px 10px;">＋新增</button>
        </div>
        <div id="todayRecords"></div>
      </div>
    </div>

    <!-- 统计页 -->
    <div class="page" id="page-stats">
      <div class="page-scroll">
        <div class="stat-section">
          <div class="stat-title">创造状态</div>
          <div class="glass stat-card" id="statusStats"></div>
        </div>
        <div class="stat-section">
          <div class="stat-title">触发 / 来源</div>
          <div class="glass stat-card" id="tagStats"></div>
        </div>
        <div class="stat-section">
          <div class="stat-title">重点观察</div>
          <div class="glass stat-card" id="hlStats"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 观测记录 Bottom Sheet -->
  <div class="sheet-mask" id="recordSheet">
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-title" id="recordSheetTitle">新增观测</div>
      <form id="recordForm">
        <div class="field">
          <div class="field-label">创造状态</div>
          <div class="status-picker" id="statusPicker">
            <button type="button" data-status="very-down"><span class="sym">↓↓</span><span class="lbl">被限制</span></button>
            <button type="button" data-status="down"><span class="sym">↓</span><span class="lbl">下降</span></button>
            <button type="button" data-status="stable"><span class="sym">→</span><span class="lbl">平稳</span></button>
            <button type="button" data-status="up"><span class="sym">↑</span><span class="lbl">流动</span></button>
            <button type="button" data-status="very-up"><span class="sym">↑↑</span><span class="lbl">创造</span></button>
          </div>
        </div>
        <div class="field">
          <label class="switch-row" style="padding:0;">
            <span class="lbl"><span style="color:var(--star);">★</span> 重点观察</span>
            <button type="button" class="switch" id="isHighlight" aria-label="重点观察"></button>
          </label>
        </div>
        <div class="field">
          <label class="switch-row" style="padding:0;">
            <span class="lbl">💡 追溯创造</span>
            <button type="button" class="switch" id="isCreation" aria-label="追溯创造"></button>
          </label>
          <div id="creationDateField" style="display:none; margin-top:8px;">
            <div class="field-label">这件事是哪天创造的？</div>
            <input type="date" id="recordCreationDate">
          </div>
        </div>
        <div class="field">
          <div class="field-label">触发 / 来源</div>
          <div class="tag-picker" id="tagPicker"></div>
          <div class="tag-input-row">
            <input type="text" id="newTagInput" placeholder="新标签名称" style="flex:1;">
            <button type="button" class="btn btn-ghost btn-sm" id="addTagBtn">添加</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">备注（可选）</div>
          <textarea id="recordNote" placeholder="当时的感受、背景、值得回看的细节…"></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top: 6px;">
          <button type="submit" class="btn btn-primary btn-block">保存</button>
        </div>
        <div style="display:flex; gap:10px; margin-top:10px;">
          <button type="button" class="btn btn-ghost btn-block" id="cancelRecordBtn">取消</button>
        </div>
        <button type="button" class="btn btn-danger btn-block" id="deleteRecordBtn" style="margin-top:10px; display:none;">删除此记录</button>
      </form>
    </div>
  </div>

  <!-- 设置 Bottom Sheet -->
  <div class="sheet-mask" id="settingsSheet">
    <div class="sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-title">设置</div>

      <div class="settings-group">
        <div class="settings-row">
          <span class="lbl">每天提醒回看</span>
          <button type="button" class="switch" id="reminderEnabled"></button>
        </div>
        <div class="settings-row">
          <span class="lbl">提醒时间</span>
          <input type="time" id="reminderTime" style="border:none; background:transparent; color:var(--text-2); font-size:15px; width:auto;">
        </div>
      </div>

      <div class="stat-title" style="margin: 4px 4px 8px;">标签库</div>
      <div class="settings-group" id="tagGroupLibrary"></div>

      <div class="stat-title" style="margin: 4px 4px 8px;">背景图</div>
      <div class="settings-group">
        <div class="settings-row" style="border-bottom:none; flex-wrap:wrap; gap:8px;">
          <span class="lbl">背景图</span>
          <span style="flex-basis:100%; font-size:12px; color:var(--text-3);">支持从相册选图或粘贴图床链接</span>
        </div>
        <div style="display:flex; gap:8px; padding:0 0 12px;">
          <button type="button" class="btn btn-soft" id="pickBgBtn" style="flex:1;">相册选图</button>
          <input type="text" id="bgUrlInput" placeholder="或粘贴图床链接 https://…" style="flex:1.6; border:1px solid var(--hairline); border-radius:12px; background:rgba(255,255,255,0.7); padding:10px 12px; font-size:12px; outline:none; color:var(--text-1); min-width:0;">
        </div>
        <div style="display:flex; gap:8px; padding:0 0 14px;">
          <button type="button" class="btn btn-soft" id="applyBgBtn" style="flex:1;">应用</button>
          <button type="button" class="btn btn-ghost" id="clearBgBtn" style="flex:1;">清除背景图</button>
        </div>
      </div>

      <div class="stat-title" style="margin: 4px 4px 8px;">自定义样式</div>
      <div class="settings-group">
        <div class="settings-row" style="border-bottom:none;">
          <span class="lbl">自定义 CSS</span>
        </div>
        <div style="padding: 0 0 14px;">
          <textarea id="customCSS" placeholder="/* 输入自定义 CSS 覆盖默认样式 */&#10;body { --primary: #8E4EC6; }" style="width:100%; border:1px solid var(--hairline); border-radius:12px; background:rgba(255,255,255,0.7); padding:12px; font-size:12px; font-family:Menlo, Monaco, monospace; min-height:120px; resize:vertical; outline:none; color:var(--text-1);"></textarea>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button type="button" class="btn btn-soft" id="cssExampleBtn" style="flex:1;">示例 CSS</button>
            <button type="button" class="btn btn-soft" id="applyCSSBtn" style="flex:1;">应用样式</button>
          </div>
        </div>
      </div>

      <div class="stat-title" style="margin: 4px 4px 8px;">数据</div>
      <div class="settings-group" style="padding: 10px 16px;">
        <button type="button" class="btn btn-ghost btn-block" id="exportDataBtn" style="margin-bottom:8px;">导出数据</button>
        <button type="button" class="btn btn-ghost btn-block" id="importDataBtn" style="margin-bottom:8px;">导入数据</button>
        <button type="button" class="btn btn-danger btn-block" id="clearAllDataBtn">清除所有数据</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
